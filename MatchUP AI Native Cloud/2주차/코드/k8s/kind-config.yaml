# kind 클러스터 정의 — 이름 three-tier
# web 계층의 NodePort 30080을 호스트 8080으로 내보내 외부 접근을 재현한다.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: three-tier
nodes:
  - role: control-plane
    extraPortMappings:
      # web 계층만 호스트로 노출한다. api(8080)·db(5432)는 매핑하지 않는다 (AC-4, AC-5).
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker
